name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "yuri/**"

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_financial_dashboard_ci
      AUTH_SECRET: ci-auth-secret-not-for-production
      AUTH_GOOGLE_ID: ci-google-id
      AUTH_GOOGLE_SECRET: ci-google-secret
      TELEGRAM_BOT_TOKEN: ci-telegram-token
      TELEGRAM_CHAT_ID: "0"
      CRON_SECRET: ci-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
